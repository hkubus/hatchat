# Typecheck, unit tests and the end-to-end smoke test on every push and PR.
#
# The smoke test boots a real server and runner and drives a turn through the
# fake provider, so it needs no API keys. Node 22.18+ is required: the store
# uses `node:sqlite`, and isolated plugins use the permission model.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build the web app
        run: pnpm --filter @hat/web build

      - name: Smoke test (server + runner end to end)
        run: pnpm smoke
