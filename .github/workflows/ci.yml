# Typecheck, unit tests and the end-to-end smoke test on every push and PR.
#
# The smoke test boots a real server and runner and drives a turn through the
# fake provider, so it needs no API keys. Node 22.18+ is required: the store
# uses `node:sqlite`, and isolated plugins use the permission model.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: the job only checks out and tests the code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build the web app
        run: pnpm --filter @hat/web build

      - name: Smoke test (server + runner end to end)
        run: pnpm smoke

  # The iOS app's non-UI core (apps/ios/HatKit): models, SSE parser, view-model,
  # HTTP client and chat store. It has no UIKit or SwiftUI dependency, so it
  # builds on Linux, and its ServerTests drive it against a real server and
  # runner. The SwiftUI app itself is compiled by the ios-ipa workflow.
  ios-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # The hosted Ubuntu image ships a Swift toolchain.
      - name: Swift version
        run: swift --version

      - name: HatKit tests against a live server
        run: apps/ios/scripts/test-hatkit.sh
