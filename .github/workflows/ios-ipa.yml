# Builds the SwiftUI app as an *unsigned* IPA on a hosted macOS runner.
#
# Why this exists: a device build signed by Xcode needs a paid Apple Developer
# team. With a free Apple ID the route is to build unsigned here and let
# SideStore (or AltStore/Sideloadly) sign it on-device. The cost is that the app
# expires after 7 days and is capped at 3 sideloaded apps at a time.
#
# Once there is a paid team, archive and export from Xcode (or add signing
# here) instead — see docs/ios-app.md.
#
# Result is uploaded as the `hat-unsigned-ipa` artifact.

name: ios-ipa

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios-ipa.yml"
  push:
    tags:
      - "mobile-v*"

# Read-only token: the job only checks out code and uploads an artifact.
permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-26 is the image whose default Xcode ships the iOS 26 SDK. Liquid
    # Glass only renders in a binary built against it; older SDKs would not
    # compile the `glassEffect` calls at all.
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: HatKit unit tests
        # The server-backed tests run in ci.yml; here they skip themselves.
        working-directory: apps/ios/HatKit
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        # Generated every time from project.yml, and gitignored, so it cannot
        # drift from the spec.
        working-directory: apps/ios
        run: xcodegen generate

      - name: Build unsigned Release binary
        working-directory: apps/ios
        run: |
          set -euo pipefail
          xcodebuild \
            -project Hat.xcodeproj \
            -scheme Hat \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package the .app as an unsigned IPA
        working-directory: apps/ios
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP" || { echo "no .app produced" >&2; exit 1; }
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry hat-unsigned.ipa Payload
          unzip -l hat-unsigned.ipa | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: hat-unsigned-ipa
          path: apps/ios/hat-unsigned.ipa
          if-no-files-found: error
